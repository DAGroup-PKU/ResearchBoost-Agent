# Host paths come from the environment of `harbor run` (see researchboost.env.example):
#   RESEARCHBOOST_ASSETS_ROOT   asset root; this task reads <root>/gaussian_splatting (tandt/truck: the Tanks&Temples
#                               truck scene of upstream's T&T+DB data set; torch/hub/checkpoints: the VGG-16 and LPIPS
#                               weights; optionally pack/: a preparation pack; see ../README.md), provisioned on the
#                               host beforehand (asset-prep/scripts/prepare_gs_assets.py, or scripts/prepare_assets.py --task gaussian_splatting)
#   RESEARCHBOOST_SCRATCH_ROOT  scratch root; <root>/gaussian_splatting is the trial's /tmp (the judge's scratch space);
#                               it is emptied when a trial starts, so run one trial per scratch root at a time
services:
  main:
    shm_size: 16gb
    environment:
      RESEARCHBOOST_SMOKE: ${RESEARCHBOOST_SMOKE:-}
      RESEARCHBOOST_GS_CONTROLS: ${RESEARCHBOOST_GS_CONTROLS:-1}
    volumes:
      - ${RESEARCHBOOST_ASSETS_ROOT:?set RESEARCHBOOST_ASSETS_ROOT (see researchboost.env.example)}/gaussian_splatting:/opt/researchboost/assets:ro
      - ${RESEARCHBOOST_SCRATCH_ROOT:?set RESEARCHBOOST_SCRATCH_ROOT (see researchboost.env.example)}/gaussian_splatting:/tmp
