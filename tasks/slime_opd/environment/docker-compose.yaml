# Host paths come from the environment of `harbor run` (see researchboost.env.example):
#   RESEARCHBOOST_ASSETS_ROOT   asset root; this task reads <root>/slime_opd (Qwen3.5-9B: the student's HF
#                               checkpoint, Qwen3.5-9B_torch_dist: its Megatron conversion, Qwen3.5-27B: the teacher's
#                               HF checkpoint, data/dapo-math-17k.jsonl; see ../README.md and asset-prep/), provisioned
#                               on the host beforehand
#   RESEARCHBOOST_SCRATCH_ROOT  scratch root; <root>/slime_opd is the trial's /tmp (the judge's scratch space); it is
#                               emptied when a trial starts, so run one trial per host at a time
services:
  main:
    shm_size: 256gb
    ulimits:
      memlock: -1
      stack: 67108864
      nofile: 1048576
    environment:
      RESEARCHBOOST_SMOKE: ${RESEARCHBOOST_SMOKE:-}
      RESEARCHBOOST_SLIME_OPD_CONTROLS: ${RESEARCHBOOST_SLIME_OPD_CONTROLS:-1}
    volumes:
      - ${RESEARCHBOOST_ASSETS_ROOT:?set RESEARCHBOOST_ASSETS_ROOT (see researchboost.env.example)}/slime_opd:/opt/researchboost/assets:ro
      - ${RESEARCHBOOST_SCRATCH_ROOT:?set RESEARCHBOOST_SCRATCH_ROOT (see researchboost.env.example)}/slime_opd:/tmp
