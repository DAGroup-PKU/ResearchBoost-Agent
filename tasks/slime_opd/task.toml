schema_version = "1.3"
artifacts = ["/submission/slime_opd", "/submission/switches.json", "/opt/candidate-env"]

[task]
name = "researchboost/slime_opd"
description = "Speed up one step of on-policy distillation in slime (student Qwen3.5-9B: sglang rollout + Megatron training; teacher Qwen3.5-27B: an sglang server scoring the student's samples; colocated on 4 Hopper GPUs); the rollout and the teacher's log-probabilities must stay equivalent to the reference's and the training bitwise identical (N0) or statistically equivalent (N1)."

[agent]
# 10 hours for the agent (a run may set another budget).
timeout_sec = 36000
user = "agent"
# Internet access. The container holds no credentials (checked at startup by /opt/researchboost/no_credentials.py).
network_mode = "public"

[environment]
workdir = "/submission/slime_opd"
gpus = 4
gpu_types = ["H200"]
cpus = 96
# CPU-offloaded Adam (fp32 master weights and moments of 9B parameters), Ray, two student sglang engines and the
# teacher's sglang server.
memory_mb = 1048576
storage_mb = 1048576
# The base image is about 17 GB.
build_timeout_sec = 7200

[environment.healthcheck]
command = "test -f /run/researchboost-ready"
interval_sec = 10
timeout_sec = 60  # Harbor fails the trial when one check exec times out (11-05: two trials on a busy host)
# The rollout fixture, the reference rollout scored by the stock engines, three stock teacher replays, ten reference
# train records, the unchanged tree's quick and full checks, the side timings and eleven controls.
start_period_sec = 72000
retries = 3

[verifier]
# A full check: three full-loop timing runs, one rollout run scored by the stock engines (student token forcing,
# stock teacher replay) with its mismatch run, one teacher replay and one train record run.
timeout_sec = 25200
environment_mode = "shared"
user = "root"
network_mode = "no-network"
