# Host paths come from the environment of `harbor run` (see researchboost.env.example):
#   RESEARCHBOOST_ASSETS_ROOT   asset root; this task reads <root>/nanochat (data/base_data_climbmix: ClimbMix shards,
#                               data/tokenizer: the tokenizer trained on them, optionally pack/: a preparation pack; see
#                               ../README.md), provisioned on the host beforehand
#   RESEARCHBOOST_SCRATCH_ROOT  scratch root; <root>/nanochat is the trial's /tmp (the judge's scratch space); it is
#                               emptied when a trial starts, so run one trial per host at a time
services:
  main:
    shm_size: 256gb
    environment:
      RESEARCHBOOST_SMOKE: ${RESEARCHBOOST_SMOKE:-}
      RESEARCHBOOST_NANOCHAT_CONTROLS: ${RESEARCHBOOST_NANOCHAT_CONTROLS:-1}
    volumes:
      - ${RESEARCHBOOST_ASSETS_ROOT:?set RESEARCHBOOST_ASSETS_ROOT (see researchboost.env.example)}/nanochat:/opt/researchboost/assets:ro
      - ${RESEARCHBOOST_SCRATCH_ROOT:?set RESEARCHBOOST_SCRATCH_ROOT (see researchboost.env.example)}/nanochat:/tmp
